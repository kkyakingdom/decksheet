<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>三國：謀定天下 자료실</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" class="page-shell">
    <section id="loginView" class="auth-card" hidden>
      <div class="crest" aria-hidden="true">謀</div>
      <h1>三國：謀定天下 자료실</h1>
      <p class="muted">지정된 Discord 서버와 역할을 보유한 사용자만 열람할 수 있습니다.</p>
      <a id="loginButton" class="discord-button" href="#">Discord로 로그인</a>
      <p id="authError" class="error-message" hidden></p>
    </section>

    <section id="forbiddenView" class="auth-card" hidden>
      <div class="crest warn" aria-hidden="true">!</div>
      <h1>접근 권한이 없습니다</h1>
      <p class="muted">지정된 Discord 서버에 가입하고 허용 역할을 보유한 계정으로 로그인해 주세요.</p>
      <a id="reloginButton" class="discord-button" href="#">다른 Discord 계정으로 로그인</a>
    </section>

    <section id="viewerView" class="viewer" hidden>
      <header class="topbar">
        <div class="brand-block">
          <div class="mini-crest">謀</div>
          <div>
            <h1 id="sheetTitle">자료실</h1>
            <p id="sheetStatus" class="status-text">불러오는 중…</p>
          </div>
        </div>
        <div class="user-block">
          <img id="userAvatar" class="avatar" alt="" hidden>
          <span id="userName" class="user-name"></span>
          <button id="logoutButton" class="logout-button" type="button">로그아웃</button>
        </div>
      </header>

      <nav id="tabs" class="tabs" aria-label="시트 탭"></nav>
      <div id="loading" class="loading-panel" hidden><div class="spinner" aria-hidden="true"></div><span>시트 데이터를 불러오는 중입니다…</span></div>
      <div id="sheetError" class="sheet-error" hidden></div>
      <div id="sheetViewport" class="sheet-viewport" hidden><div id="sheetCanvas" class="sheet-canvas"></div></div>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
